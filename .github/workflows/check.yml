name: Validate skill library

# Enforces the CLAUDE.md contract: INDEX↔files bijection, sequential ranks,
# skill anatomy, page-length cap, read-cost drift, README counts.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node check.mjs
